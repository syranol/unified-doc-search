name: Docker Build Template

# This workflow is kept as a template and is not wired to automatic triggers.
# When you're ready to use it, add push/tag events back under `on:`.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Dockerfile presence
        id: dockerfile
        run: |
          if [ -f Dockerfile ]; then
            echo "dockerfile=true" >> "$GITHUB_OUTPUT"
          else
            echo "dockerfile=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip build (Dockerfile missing)
        if: steps.dockerfile.outputs.dockerfile == 'false'
        run: echo "No Dockerfile found; skipping docker build."

      - name: Set up Docker Buildx
        if: steps.dockerfile.outputs.dockerfile == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.dockerfile.outputs.dockerfile == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        if: steps.dockerfile.outputs.dockerfile == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      - name: Build and push
        if: steps.dockerfile.outputs.dockerfile == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
*** End
